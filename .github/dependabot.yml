version: 2
# Weekly updates, grouped so a week brings a few pull requests, not dozens (OPS-16/17).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # All of Angular moves together (runtime, CLI, build and compiler); a major is an `ng update`.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/*"]
      dev-tools:
        dependency-type: development
        exclude-patterns: ["@angular/*", "@angular-devkit/*", "@schematics/*", "typescript"]
    ignore:
      # Angular sets the TypeScript minor it supports (22.3: >=6.0 <6.1); it moves with ng update.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
