name: ci

# Every pull request and every push to main: format, translations, unit tests, the production
# build, a dependency audit, the image (scanned) and a CycloneDX SBOM. Actions are pinned to
# commit SHAs (Dependabot keeps them current).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exactly the locked versions
        run: npm ci --no-audit --no-fund
      - name: Format
        run: npm run format:check
      - name: Translations (English and Swahili keys match)
        run: npm run i18n:check
      - name: No browser confirm/alert/prompt (the app's ConfirmService instead)
        run: npm run lint:dialogs
      - name: Colour contrast of the design tokens (WCAG 2.2 AA)
        run: npm run a11y:contrast
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dependency audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm@4 --omit dev --output-file sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-web
          path: sbom.cdx.json

  image:
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the image (tagged with the commit, not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: pharmacy-core-web:${{ github.sha }}
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: pharmacy-core-web:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
