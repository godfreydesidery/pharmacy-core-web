name: ci

# Every pull request and every push to main: format, translations, unit tests, an axe check, the production
# build, a dependency audit, the image (scanned) and a CycloneDX SBOM. Actions are pinned to
# commit SHAs (Dependabot keeps them current).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - name: Install exactly the locked versions
        run: npm ci --no-audit --no-fund
      - name: Format
        run: npm run format:check
      - name: Translations (English and Swahili keys match)
        run: npm run i18n:check
      - name: No browser confirm/alert/prompt (the app's ConfirmService instead)
        run: npm run lint:dialogs
      - name: Colour contrast of the design tokens (WCAG 2.2 AA)
        run: npm run a11y:contrast
      - name: Unit tests
        run: npm test
      - name: Accessibility (axe-core on the shared components and key pages, stub API; serious or critical fails)
        run: npm run a11y:axe
      - name: Production build
        run: npm run build
      - name: Dependency audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm@4 --omit dev --output-file sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-web
          path: sbom.cdx.json

  image:
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (tagged with the commit, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: pharmacy-core-web:${{ github.sha }}
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pharmacy-core-web:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
